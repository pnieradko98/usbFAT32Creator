name: windows-portable-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Configure CMake
        shell: pwsh
        run: |
          $searchRoots = @(
            (Join-Path $env:GITHUB_WORKSPACE "Qt"),
            (Join-Path $env:GITHUB_WORKSPACE "..\Qt"),
            (Join-Path $env:RUNNER_WORKSPACE "Qt")
          ) | Where-Object { Test-Path $_ }

          $qtConfig = $null
          foreach ($root in $searchRoots) {
            $qtConfig = Get-ChildItem -Path $root -Filter "Qt6Config.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($qtConfig) {
              break
            }
          }

          if (-not $qtConfig) {
            throw "Qt6Config.cmake not found in known Qt install locations"
          }

          $qtDir = $qtConfig.Directory.FullName
          Write-Host "Detected Qt6_DIR: $qtDir"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DQt6_DIR="$qtDir"

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --target usb_fat32_creator

      - name: Create portable package
        shell: pwsh
        run: |
          $appDir = Join-Path $PWD "dist/USB_FAT32_Creator"
          New-Item -ItemType Directory -Path $appDir -Force | Out-Null

          $exeSrc = Join-Path $PWD "build/Release/usb_fat32_creator.exe"
          if (-not (Test-Path $exeSrc)) {
            throw "EXE not found: $exeSrc"
          }
          Copy-Item $exeSrc $appDir -Force

          if ($env:QT_ROOT_DIR -and (Test-Path $env:QT_ROOT_DIR)) {
            $qtBinDir = Join-Path $env:QT_ROOT_DIR "bin"
          } else {
            $qtConfig = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "..\Qt") -Filter "Qt6Config.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $qtConfig) {
              throw "Cannot detect Qt installation for windeployqt"
            }
            $qtBinDir = Join-Path (Resolve-Path (Join-Path $qtConfig.Directory.FullName "../../..")) "bin"
          }
          $windeployqt = Join-Path $qtBinDir "windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt not found: $windeployqt"
          }

          & $windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw (Join-Path $appDir "usb_fat32_creator.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          $portableReadme = @(
            "USB FAT32 Creator - Portable (Windows)",
            "",
            "Jak uruchomic:",
            "1. Rozpakuj ZIP do dowolnego folderu.",
            "2. Uruchom usb_fat32_creator.exe jako Administrator.",
            "3. Najpierw uzyj przycisku Testuj i zweryfikuj plan.",
            "",
            "Uwaga:",
            "- Operacje partycjonowania sa nieodwracalne i usuwaja dane."
          )
          Set-Content -Path (Join-Path $appDir "README_PORTABLE.txt") -Value $portableReadme -Encoding ASCII

          $zipPath = Join-Path $PWD "dist/usb_fat32_creator_windows_portable.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath $zipPath

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-fat32-creator-windows-portable
          path: dist/usb_fat32_creator_windows_portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "dist/usb_fat32_creator_windows_portable.zip"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --title $tag --notes "Automatyczny release portable build"
          } else {
            gh release upload $tag $asset --clobber
          }
