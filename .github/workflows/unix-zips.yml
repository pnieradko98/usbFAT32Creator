name: unix-zips-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-macos-zip:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          host: mac
          target: desktop
          arch: clang_64

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          QT6_CONFIG=$(find "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$RUNNER_WORKSPACE" -type f -name Qt6Config.cmake | head -n 1)
          if [[ -z "${QT6_CONFIG:-}" ]]; then
            echo "Qt6Config.cmake not found" >&2
            exit 1
          fi
          QT6_DIR=$(dirname "$QT6_CONFIG")
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQt6_DIR="$QT6_DIR"

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target usb_fat32_creator

      - name: Create macOS zip package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APP_DIR="dist/USB FAT32 Creator.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp build/usb_fat32_creator "$APP_DIR/Contents/MacOS/usb_fat32_creator"
          chmod +x "$APP_DIR/Contents/MacOS/usb_fat32_creator"

          cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>USB FAT32 Creator</string>
            <key>CFBundleDisplayName</key>
            <string>USB FAT32 Creator</string>
            <key>CFBundleIdentifier</key>
            <string>com.usbfat32.creator</string>
            <key>CFBundleExecutable</key>
            <string>usb_fat32_creator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
          </dict>
          </plist>
          PLIST

          MACDEPLOYQT=$(find "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$RUNNER_WORKSPACE" -type f -name macdeployqt | head -n 1)
          if [[ -z "${MACDEPLOYQT:-}" ]]; then
            echo "macdeployqt not found" >&2
            exit 1
          fi

          "$MACDEPLOYQT" "$APP_DIR"

          # Ensure bundle has a valid ad-hoc signature after deployment.
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          cat > "$APP_DIR/Contents/Resources/README_PORTABLE.txt" << 'TXT'
          USB FAT32 Creator - macOS package

          Jak uruchomic:
          1. Rozpakuj ZIP.
          2. Otworz "USB FAT32 Creator.app".

          Jesli macOS pokazuje komunikat, ze aplikacja jest uszkodzona:
          xattr -dr com.apple.quarantine "/sciezka/do/USB FAT32 Creator.app"

          Uwaga:
          - Operacje partycjonowania sa nieodwracalne i usuwaja dane.
          TXT

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/usb_fat32_creator_macos_portable.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-fat32-creator-macos-portable
          path: dist/usb_fat32_creator_macos_portable.zip
          if-no-files-found: error

      - name: Publish macOS release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSET="dist/usb_fat32_creator_macos_portable.zip"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automatyczne paczki binarne" || true
          gh release upload "$TAG" "$ASSET" --clobber

  build-linux-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libgles2-mesa-dev libfuse2 patchelf

      - name: Install Qt 6 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          host: linux
          target: desktop
          arch: gcc_64

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          QT6_CONFIG=$(find "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$RUNNER_WORKSPACE" -type f -name Qt6Config.cmake | head -n 1)
          if [[ -z "${QT6_CONFIG:-}" ]]; then
            echo "Qt6Config.cmake not found" >&2
            exit 1
          fi
          QT6_DIR=$(dirname "$QT6_CONFIG")
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQt6_DIR="$QT6_DIR"

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target usb_fat32_creator

      - name: Download linuxdeploy tools
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp build/usb_fat32_creator AppDir/usr/bin/usb_fat32_creator
          chmod +x AppDir/usr/bin/usb_fat32_creator

          # Ikona — konwertujemy XPM na PNG za pomocą Qt lub ImageMagick
          if command -v convert &>/dev/null; then
            convert src/assets/app_icon.xpm AppDir/usr/share/icons/hicolor/256x256/apps/usb_fat32_creator.png
          else
            # Fallback: utwórz minimalną ikonę PNG
            python3 -c "
          import struct, zlib
          def png_chunk(t,d): l=struct.pack('>I',len(d)); c=struct.pack('>I',zlib.crc32(t+d)&0xFFFFFFFF); return l+t+d+c
          sig=b'\\x89PNG\\r\\n\\x1a\\n'
          ihdr=png_chunk(b'IHDR',struct.pack('>IIBBBBB',32,32,8,2,0,0,0))
          raw=b''.join(b'\\x00'+b'\\x00\\x55\\xaa'*32 for _ in range(32))
          idat=png_chunk(b'IDAT',zlib.compress(raw))
          iend=png_chunk(b'IEND',b'')
          open('AppDir/usr/share/icons/hicolor/256x256/apps/usb_fat32_creator.png','wb').write(sig+ihdr+idat+iend)
          "
          fi

          # Plik .desktop
          cp src/assets/usb_fat32_creator.desktop AppDir/usr/share/applications/usb_fat32_creator.desktop

      - name: Build AppImage
        shell: bash
        env:
          QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
          QML_SOURCES_PATHS: .
          EXTRA_QT_PLUGINS: xcbglintegrations
        run: |
          set -euo pipefail
          export QMAKE="$(find "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$RUNNER_WORKSPACE" -type f -name qmake6 -o -name qmake | head -n 1)"
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          # linuxdeploy generuje plik *.AppImage w bieżącym katalogu
          ls -lh *.AppImage

      - name: Rename and move AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv *.AppImage dist/usb_fat32_creator_linux.AppImage
          chmod +x dist/usb_fat32_creator_linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-fat32-creator-linux-appimage
          path: dist/usb_fat32_creator_linux.AppImage
          if-no-files-found: error

      - name: Publish Linux release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSET="dist/usb_fat32_creator_linux.AppImage"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automatyczne paczki binarne" || true
          gh release upload "$TAG" "$ASSET" --clobber
